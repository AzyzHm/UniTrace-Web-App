# ==============================================================================
# CHANGELOG — Ajout des Facettes de Recherche ($facet)
# Projet : UniTrace — Binôme 2 (Search & Exploration)
# Date : 2026-11-23
# Auteur : Binôme 2
# ==============================================================================
#
# RÔLE DE CE FICHIER
#   Documenter TOUTES les modifications apportées pour ajouter la fonctionnalité
#   "Facettes de recherche" (compteurs par catégorie/type/statut renvoyés avec
#   les résultats, en une seule requête MongoDB via $facet).
#
#   Ce fichier sert à :
#     1. Expliquer ce qui a été ajouté/modifié et pourquoi.
#     2. Servir de support pour la soutenance (défense des choix techniques).
#     3. Faciliter la relecture par les autres binômes (Binôme 1, 3, 4).
# ==============================================================================

metadata:
  feature: "Facettes de recherche ($facet)"
  domain: "search"
  owner: "Binôme 2"
  status: "terminé et testé"
  date: "2026-11-23"
  version: "1.0.0"

# ==============================================================================
# 1. RÉSUMÉ FONCTIONNEL
# ==============================================================================

resume:
  objectif: >
    Permettre au front d'afficher, en plus des résultats de recherche,
    des COMPTEURS par catégorie, type et statut (ex. "Sac (12), Téléphone (8)...").
    Ces compteurs sont calculés sur LE MÊME FILTRE que les résultats,
    en UNE SEULE requête MongoDB (agrégation $facet), au lieu de N+1 requêtes.

  endpoint_principal:
    methode: "GET"
    url: "/api/v1/search/declarations"
    nouveau_parametre: "?facets=category,type,status"
    ancien_comportement: "Sans ?facets=, la réponse est identique à avant (pas de facettes)."

  exemple_requete: |
    GET /api/v1/search/declarations?facets=category&type=lost&q=sac

  exemple_reponse: |
    {
      "data": [...],
      "facets": {
        "category": [
          { "key": "wallet_bag", "label": "Portefeuille / sac", "count": 4 },
          { "key": "other", "label": "Autre", "count": 1 }
        ]
      },
      "pagination": { "total": 5, ... },
      "appliedFilters": { "q": "sac", "type": "lost", ... }
    }

  valeurs_autorisees:
    - "category (14 catégories : phone, wallet_bag, ...)"
    - "type (lost, found)"
    - "status (pending, matched, resolved, expired, hidden, deleted)"

  limites:
    - "Maximum 3 facettes par requête (MAX_FACETS_PER_REQUEST)."
    - "Maximum 20 valeurs par facette (MAX_FACET_VALUES)."
    - "Facette inconnue → 400 INVALID_QUERY."
    - "$facet charge tous les documents matchés en mémoire → à utiliser avec des filtres."

# ==============================================================================
# 2. FICHIERS CRÉÉS
# ==============================================================================

fichiers_crees:

  - chemin: "backend/src/constants/search/facets-options.js"
    role: >
      Définit les facettes autorisées et les limites, en UN SEUL endroit
      (source unique de vérité). Utilisé par le validator Joi, le service
      et le presenter.
    contenu:
      - "FACET_KEYS : { CATEGORY: 'category', TYPE: 'type', STATUS: 'status' }"
      - "FACET_VALUES : ['category', 'type', 'status']"
      - "MAX_FACET_VALUES : 20 (limite par facette)"
      - "MAX_FACETS_PER_REQUEST : 3 (limite par requête)"
    pourquoi:
      - "Évite les nombres magiques éparpillés dans le code."
      - "Cohérent avec le reste du projet (search-options.js, saved-search-options.js)."
      - "Testable unitairement."

  - chemin: "backend/src/presenters/search/search-facets.presenter.js"
    role: >
      Transforme les facettes brutes (résultat MongoDB $facet : { _id, count })
      en réponse lisible : [{ key, label, count }] avec libellés français.
    contenu:
      - "LABELS_BY_FACET : dictionnaire de libellés par facette (CATEGORY_LABELS, TYPE_LABELS, STATUS_LABELS)."
      - "toFacetsResponse(rawFacets) : applique les libellés, trie par count, limite à MAX_FACET_VALUES."
    pourquoi:
      - "Séparation des responsabilités : le repository renvoie les données brutes, le presenter les met en forme."
      - "Cohérent avec saved-search.presenter.js et declaration.presenter.js."
      - "Le front ne code aucun libellé en dur."

# ==============================================================================
# 3. FICHIERS MODIFIÉS
# ==============================================================================

fichiers_modifies:

  - chemin: "backend/src/validators/search/search.validator.js"
    role_initial: "Définissait les paramètres de la query de recherche (q, type, status, sort, page, limit...)."
    modification: >
      Ajout d'un champ `facets` dans le schéma Joi `searchQuerySchema`.
      Nouvelle fonction `facetsField()` (même logique que `statusListField`) :
        - Accepte `?facets=category,type` ET `?facets=category&facets=type`.
        - Dédoublonne les valeurs.
        - Refuse une valeur inconnue (400).
        - Limite à MAX_FACETS_PER_REQUEST (3).
    pourquoi:
      - "Validation stricte : un client ne peut pas envoyer n'importe quoi."
      - "Cohérent avec le validateur `status` existant."
    impact: "?facets=foo → 400 INVALID_QUERY avec message explicite."

  - chemin: "backend/src/repositories/search/search.repository.js"
    role_initial: "Exécutait les requêtes MongoDB (count, findPage, findById, topValues)."
    modification: >
      Ajout d'une méthode `searchWithFacets(filter, options)` qui exécute
      une agrégation MongoDB `$facet` :
        - metadata : { total }
        - data : la page demandée (skip + limit)
        - <facet> : les compteurs par valeur pour chaque facette demandée.
      Post-traitement : supprime privateInfo, owner, statusBeforeHidden des items.
    pourquoi:
      - "Une seule requête MongoDB au lieu de count + findPage + N requêtes par facette."
      - "Le repository ne décide d'aucune règle : il exécute."
    impact: "Nouvelle méthode exposée : searchWithFacets."

  - chemin: "backend/src/services/search/search.service.js"
    role_initial: "Contenait toutes les règles métier de la recherche (statuts, droits, tri, pagination, cache)."
    modification: >
      Ajout d'un branchement conditionnel dans `searchDeclarations` :
        - Si `query.facets` est non vide : appel à `searchRepository.searchWithFacets`.
        - Sinon : comportement actuel (count + findPage).
      Ajout de deux helpers internes :
        - `buildAppliedFilters()` : construit l'objet appliedFilters (partagé).
        - `buildPagination()` : construit l'objet pagination (partagé).
    pourquoi:
      - "Opt-in : sans ?facets=, on garde le chemin count + findPage (plus économe en mémoire)."
      - "$facet charge tout en mémoire → on ne l'active que sur demande."
      - "Évite la duplication entre les deux chemins."
    impact: "La réponse contient `facets` UNIQUEMENT si ?facets= est demandé."

  - chemin: "backend/src/controllers/search/search.controller.js"
    role_initial: "Transmettait la requête au service et formatif la réponse avec le presenter."
    modification: >
      La méthode `searchDeclarations` destructure désormais `{ items, facets, ...rest }`
      et ajoute `facets` à la réponse SI présent :
        `...(facets && { facets: toFacetsResponse(facets) })`
      Import de `toFacetsResponse`.
    pourquoi:
      - "Le controller ne fait que transmettre et formater (aucune règle métier)."
      - "La condition `facets &&` évite d'ajouter `facets: undefined` à la réponse JSON."
    impact: "Le front reçoit `facets` formaté par le presenter."

# ==============================================================================
# 4. FICHIERS NON MODIFIÉS (vérification)
# ==============================================================================

fichiers_non_modifies:
  - chemin: "backend/src/routes/search/search.routes.js"
    raison: "La route GET /declarations passe déjà par validateSearchQuery."
  - chemin: "backend/src/middlewares/search/validate-search-query.js"
    raison: "Le middleware est générique : il applique le schéma Joi, peu importe son contenu."
  - chemin: "backend/src/models/declarations/declaration.model.js"
    raison: "Aucun champ ajouté : $facet est une agrégation, pas un changement de schéma."
  - chemin: "backend/src/container/search.js"
    raison: "Aucune nouvelle dépendance à injecter : searchWithFacets est une méthode du repository existant."
  - chemin: "backend/src/models/declarations/declaration-search-indexes.js"
    raison: "Les index existants ({ status: 1, date: -1 }) sont utilisés par $match avant $facet."

# ==============================================================================
# 5. CHOIX TECHNIQUES (à défendre en soutenance)
# ==============================================================================

choix_techniques:

  - titre: "Opt-in via ?facets="
    explication: >
      Sans ?facets=, la réponse est identique à avant (count + findPage).
      $facet n'est activé que sur demande, car il charge tous les documents
      matchés en mémoire (limite MongoDB : 100 MB par étape).
    avantage: "Pas de régression de performance pour les requêtes sans facettes."

  - titre: "Une seule requête MongoDB"
    explication: >
      $facet permet d'exécuter plusieurs sous-pipelines en parallèle sur le même
      ensemble de documents matchés. On obtient : total + page + facettes en une requête.
    avantage: "Divise le nombre d'aller-retours par 3 ou 4."

  - titre: "Post-traitement des items"
    explication: >
      $facet ne peut pas appliquer la projection EXCLUDED_FIELDS (privateInfo, owner,
      statusBeforeHidden) dans la branche `data`, car $project + $meta: 'textScore'
      est délicat. On post-traite en JavaScript.
    avantage: "Sécurité garantie : privateInfo n'est jamais renvoyé."

  - titre: "Presenter dédié"
    explication: >
      Les facettes passent par toFacetsResponse (libellés français, limite MAX_FACET_VALUES).
      Le front ne code aucun libellé en dur.
    avantage: "Cohérent avec le reste du projet (presenters existants)."

  - titre: "Repli loose désactivé avec facettes"
    explication: >
      Le repli du lieu ($regex non indexé) n'est PAS appliqué quand facets est demandé,
      car il faudrait deux appels à searchWithFacets (complexité inutile).
    avantage: "Simplicité. Documenté."

# ==============================================================================
# 6. TESTS AJOUTÉS
# ==============================================================================

tests:
  postman:
    nombre_requetes: 7
    nombre_tests: 25
    collection: "backend/docs/search-facets.postman_collection.json"
    scenarios:
      - "00 — Login (stocke le token dans {{token}})"
      - "01 — Sans facettes (200, pas de facets)"
      - "02 — Une facette (200, facets.category + libellés)"
      - "03 — Trois facettes (200, category + type + status)"
      - "04 — Facette inconnue (400 INVALID_QUERY)"
      - "05 — Facettes + filtre (200, counts cohérents)"
      - "06 — Facettes + texte (200, counts cohérents)"

  unitaires:
    a_ajouter:
      - "search-facets.presenter.test.js (à créer)"
      - "search.service.test.js (ajouter 2 tests : avec/sans facettes)"

  integration:
    a_ajouter:
      - "search.test.js (ajouter 3 tests : facettes, 400, pas de facets)"

# ==============================================================================
# 7. IMPACT PERFORMANCE
# ==============================================================================

performance:
  sans_facettes:
    requetes_mongodb: 2
    pipeline: "countDocuments + find().sort().skip().limit()"
    cout: "O(log n) avec index."

  avec_facettes:
    requetes_mongodb: 1
    pipeline: "$match + $facet (metadata + data + N facettes)"
    cout: "O(n) en mémoire (tous les documents matchés)."
    mitigation:
      - "Limiter à 3 facettes."
      - "Limiter à 20 valeurs par facette."
      - "À utiliser avec des filtres (pas sur une recherche vide)."

# ==============================================================================
# 8. POINTS À FAIRE RELIRE PAR LES AUTRES BINÔMES
# ==============================================================================

a_faire_relire:
  - binome: "Binôme 1 (Users & Declarations)"
    point: "Aucun champ ajouté au modèle Declaration. Aucun impact sur les transitions."
  - binome: "Binôme 3 (Matching)"
    point: "Les facettes peuvent aider à visualiser les correspondances par catégorie."
  - binome: "Binôme 4 (Admin)"
    point: "Un admin peut utiliser ?facets=status pour voir la répartition des statuts."

# ==============================================================================
# 9. COMMANDES UTILES POUR TESTER
# ==============================================================================

commandes:

  demarrer_serveur: "cd backend && npm run dev"

  test_curl:
    - label: "Sans facettes"
      commande: "curl -s 'http://localhost:3000/api/v1/search/declarations' -H 'Authorization: Bearer $TOKEN' | jq"
    - label: "Une facette"
      commande: "curl -s 'http://localhost:3000/api/v1/search/declarations?facets=category' -H 'Authorization: Bearer $TOKEN' | jq"
    - label: "Facette inconnue"
      commande: "curl -s -o /dev/null -w '%{http_code}\\n' 'http://localhost:3000/api/v1/search/declarations?facets=foo' -H 'Authorization: Bearer $TOKEN'"

  postman_runner:
    etapes:
      - "Postman → Runner"
      - "Collection : UniTrace Facettes"
      - "Iterations : 1"
      - "Run"
    attendu: "7 requests, 25 tests, 0 failed"

